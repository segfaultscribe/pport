---
layout: base.njk
title: Writings
---

<div class="parent">
    <div class="megas">
        
        <!-- Filter Tags -->
        <div class="tag-filters">
            <button class="tag-btn active" onclick="filterPosts('all')">all</button>
            <button class="tag-btn" onclick="filterPosts('tech')">tech</button>
            <button class="tag-btn" onclick="filterPosts('story')">story</button>
            <button class="tag-btn" onclick="filterPosts('rant')">rant</button>
        </div>

        <!-- Dynamic Posts List generated from markdown files -->
        <ul class="posts-list">
            {% for post in collections.writings %}
            <li class="post-item" data-category="{{ post.data.category }}">
                <div class="post-main">
                    <a href="{{ post.url }}">{{ post.data.title }}</a>
                    <span class="post-tag">{{ post.data.category }}</span>
                </div>
                <span class="post-date">{{ post.data.displayDate }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>

<!-- Same filtering script as before -->
<script>
function filterPosts(category) {
    const posts = document.querySelectorAll('.post-item');
    const buttons = document.querySelectorAll('.tag-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    posts.forEach(post => {
        if (category === 'all' || post.dataset.category === category) {
            post.style.display = 'flex';
        } else {
            post.style.display = 'none';
        }
    });
}
</script>
